services:
  # 🔥 Web Service (Flask)
  - type: web
    name: niyati-engine
    env: python
    plan: free
    buildCommand: apt-get update && apt-get install -y tesseract-ocr && pip install -r requirements.txt
    startCommand: gunicorn wsgi:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: DATABASE_URL
        fromDatabase:
          name: niyati-db
          property: connectionString

  # 🔥 PostgreSQL (Render managed)
  - type: pserv
    name: niyati-db
    plan: free
