services:
  # 🔥 Flask Backend
  - type: web
    name: niyati-engine
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: DATABASE_URL
        fromDatabase:
          name: niyati-db
          property: connectionString

      - key: FLASK_SECRET_KEY
        generateValue: true

      - key: FLASK_DEBUG
        value: false

      - key: FLASK_PORT
        value: 10000

  # 🔥 PostgreSQL DB
  - type: pserv
    name: niyati-db
    plan: free
