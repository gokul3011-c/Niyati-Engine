services:
  # Web Service - Flask Backend
  - type: web
    name: niyati-engine
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: DATABASE_URL
        fromDatabase:
          name: Niyati Engine   # matches your current DB name

      - key: FLASK_SECRET_KEY
        generateValue: true

      - key: FLASK_DEBUG
        value: false

      - key: FLASK_PORT
        value: 10000
