<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Niyati Engine - Launch</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e17, #1a1f2e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #00ffd5, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #00ffd5, #00d4b3);
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            margin: 10px;
            transition: transform 0.3s;
        }
        .btn:hover {
            transform: translateY(-3px);
        }
        .info {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            max-width: 600px;
        }
        .info h3 {
            color: #00ffd5;
            margin-bottom: 15px;
        }
        .info p {
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Niyati Engine</h1>
        <p>AI-Powered Resume Screening System</p>
        
        <a href="frontend/auth.html" class="btn">🚀 Launch Frontend</a>
        
        <div class="info">
            <h3>✅ Backend Status: Running</h3>
            <p>API Server: http://localhost:5000</p>
            <p>Make sure the backend server is running before using the frontend.</p>
            <p style="margin-top: 15px; color: #00ffd5;"><strong>Click the button above to open the beautiful new interface!</strong></p>
        </div>
    </div>
</body>
</html>
